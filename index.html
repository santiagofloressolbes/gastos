<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E7EEEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1816" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Gastos</title>
<style>
:root{
  --bg:#E7EEEB; --surface:#F8FBFA; --ink:#10302B; --muted:#586D68; --line:#CBD8D4; --chip:#DAE6E2;
  --primary-bg:#10302B; --primary-fg:#F8FBFA; --accent:#F2B705; --accent-ink:#2B2100;
  --bar:#2F7F70; --bar-soft:#BBD6CF; --bad:#A83C1B; --good:#1F7A4D;
  --num:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0D1816; --surface:#14241F; --ink:#E6F1ED; --muted:#8FA8A1; --line:#26403A; --chip:#1E3530;
    --primary-bg:#F2B705; --primary-fg:#2B2100; --bar:#5FC4AE; --bar-soft:#2A4A42; --bad:#F0896A; --good:#6FD39C}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.35 var(--sans);overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--sat) + 10px) 18px 6px}
header h1{font:700 22px/1.1 var(--num);margin:0;letter-spacing:-.01em}
#upd{margin:2px 18px 6px;min-height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:14.5px}
#upd[hidden]{display:none}
.syncbtn{display:flex;align-items:center;gap:8px;min-height:44px;min-width:44px;max-width:80%;padding:4px 12px;border-radius:14px;background:var(--chip);color:var(--ink);text-align:right}
.syncbtn svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.syncbtn .st{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;min-width:0}
.syncbtn b{font-size:14px;font-weight:650}
.syncbtn small{font-size:11.5px;color:var(--muted)}
.syncbtn.wait{box-shadow:inset 0 0 0 1.5px var(--accent)}
.syncbtn.err{box-shadow:inset 0 0 0 1.5px var(--bad)} .syncbtn.err small{color:var(--bad)}
.syncbtn.off svg{color:var(--muted)}
.syncbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 18px 18px}
.view{display:none} .view.on{display:block}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(var(--sab) + 6px)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;color:var(--muted);border-radius:12px;min-height:48px}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--ink);font-weight:650}
.tabs button[aria-current=page] svg{stroke:var(--ink)}
/* controles */
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,48,43,.14)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);font-size:15px;white-space:nowrap;scroll-snap-align:start}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
.chip.ghost{background:transparent;border-style:dashed;color:var(--muted)}
.lbl{font-size:13.5px;color:var(--muted);margin:14px 0 6px;display:flex;gap:8px;align-items:baseline}
.lbl em{font-style:normal;color:var(--ink);font-weight:600}
/* captura */
.amount{display:flex;justify-content:center;align-items:baseline;gap:6px;font:700 58px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:16px 0 10px;min-height:64px}
.amount .cur{font-size:30px;color:var(--muted);font-weight:600}
.amount.empty #amtTxt{color:var(--line)}
.desc{width:100%;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:17px}
.desc::placeholder{color:var(--muted);opacity:.8}
.desc:focus{border-color:var(--ink);outline:none}
.meta{display:flex;gap:8px;margin-top:12px;align-items:center}
.meta .seg{flex:1}
.meta .seg{min-width:0}
.meta .seg button{padding:0 4px;font-size:14px;min-width:0}
.meta .chip{padding:0 11px;flex:none}
.dateBtn{position:relative;display:flex;align-items:center;gap:6px;border-color:var(--ink)}
.dateBtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dateBtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pad button{height:50px;border-radius:14px;background:var(--surface);font:600 24px var(--num);box-shadow:0 1px 0 var(--line)}
.pad button:active{background:var(--chip)}
.primary{width:100%;height:56px;border-radius:16px;background:var(--primary-bg);color:var(--primary-fg);font-weight:700;font-size:18px;margin-top:12px}
.primary:disabled{opacity:.35}
.typing .pad,.typing #save{display:none}
/* tarjetas */
.card{background:var(--surface);border-radius:20px;padding:16px;margin-top:12px}
.card h2{font:700 17px var(--num);margin:0 0 2px}
.card .sub{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.big{font:700 40px/1.05 var(--num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font-size:14px;margin-top:4px;color:var(--muted)}
.delta b{font-weight:650}
.up{color:var(--bad)} .down{color:var(--good)}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.monthnav button{width:44px;height:44px;border-radius:12px;font-size:22px;color:var(--ink)}
.monthnav button:disabled{opacity:.25}
.monthnav strong{font:650 18px var(--num)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font:600 15px var(--num);font-variant-numeric:tabular-nums;text-align:right}
.row .v small{color:var(--muted);font-weight:500;margin-left:6px}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--bar-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--bar);border-radius:4px}
.detail{padding:2px 0 8px 0;font-size:14px}
.detail div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--muted)}
.detail div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail div span:last-child{font-variant-numeric:tabular-nums;color:var(--ink)}
select{background:var(--chip);border:0;border-radius:10px;min-height:36px;padding:0 10px;font-size:14px;max-width:60%}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}
svg text{font-family:var(--sans)}
/* historial */
.day{font-size:13.5px;color:var(--muted);margin:16px 0 4px}
.mov{display:grid;grid-template-columns:1fr auto;gap:0 10px;width:100%;text-align:left;background:var(--surface);padding:11px 14px;border-radius:14px;margin-bottom:6px;min-height:56px}
.mov .d{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .s{font-size:13px;color:var(--muted);grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .a{grid-row:1/3;grid-column:2;font:650 16px var(--num);align-self:center;font-variant-numeric:tabular-nums}
.mov .a.in{color:var(--good)}
.empty-msg{text-align:center;color:var(--muted);padding:40px 10px}
/* sheet + toast */
#scrim{position:fixed;inset:0;background:rgba(8,20,17,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#scrim.on{display:flex}
#sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(var(--sab) + 18px);max-height:88dvh;overflow:auto}
#sheet h2{font:700 20px var(--num);margin:0 0 6px}
#sheet p{color:var(--muted);margin:0 0 12px;font-size:14.5px}
#sheet label{display:block;font-size:13.5px;color:var(--muted);margin:12px 0 4px}
#sheet input{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px}
#sheet .err{color:var(--bad);font-size:14px;margin-top:10px}
#sheet .btns{display:flex;gap:8px;margin-top:16px}
#sheet .btns .primary{margin:0}
.secondary{height:56px;padding:0 18px;border-radius:16px;background:var(--chip);font-weight:650}
.danger{background:var(--bad);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(var(--sab) + 76px);transform:translate(-50%,16px);background:var(--primary-bg);color:var(--primary-fg);padding:10px 8px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;width:max-content;max-width:calc(100vw - 32px);font-size:15px}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-weight:700;padding:6px 10px;border-radius:9px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){#toast{transition:none} .syncbtn.spin svg{animation:none}}
</style>
</head>
<body>
<div id="app" class="">
  <header><h1 id="title">Registrar</h1><button class="syncbtn" id="sync" type="button" aria-label="Sincronizar ahora"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span class="st"><b id="syncL">Sin configurar</b><small id="syncN"></small></span></button></header>
  <button id="upd" hidden>Hay una versión nueva · <b>Actualizar</b></button>
  <main id="main">
    <section class="view on" id="v-add" aria-label="Registrar movimiento">
      <div class="seg" id="tipoSeg" role="group" aria-label="Tipo"><button data-v="Gasto" class="on">Gasto</button><button data-v="Ingreso">Ingreso</button></div>
      <div class="amount empty" id="amount" aria-live="polite" aria-label="Monto"><span id="amtTxt">0</span><span class="cur">€</span></div>
      <input class="desc" id="desc" placeholder="¿Qué y dónde? Ej: pizza en Antonias" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Descripción">
      <div class="lbl">Categoría <em id="catHint"></em></div>
      <div class="chips" id="cats"></div>
      <div class="lbl">Con quién <span>(opcional)</span></div>
      <div class="chips" id="people"></div>
      <div class="meta"><div class="seg" id="ambSeg" role="group" aria-label="Ámbito"></div><button class="chip dateBtn" id="dateBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg><span id="dateTxt">Hoy</span><input type="date" id="dateIn" aria-label="Cambiar fecha"></button><button class="chip" id="yBtn" aria-pressed="false">Ayer</button></div>
      <div class="pad" id="pad"></div>
      <button class="primary" id="save" disabled>Guardar</button>
    </section>
    <section class="view" id="v-sum" aria-label="Resumen"></section>
    <section class="view" id="v-his" aria-label="Historial"></section>
  </main>
  <nav class="tabs" aria-label="Secciones">
    <button data-tab="add" aria-current="page"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Registrar</button>
    <button data-tab="sum"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Resumen</button>
    <button data-tab="his"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Historial</button>
  </nav>
</div>
<div id="scrim"><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"><span id="toastTxt"></span><button id="toastBtn">Deshacer</button></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const eur=(n,d=2)=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const eur0=n=>eur(n,0);
const pad2=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const yesterdayStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

const DEFAULT_CATS=[
 ...['Renta','Supermercado','Salidas','Transporte','Teléfono/Internet','Suscripciones','Viajes y Ocio','Salud y Cuidado','Ropa','Hogar','Regalos','Comidas de trabajo','Otros'].map(n=>({nombre:n,tipo:'Gasto',ambito:'Personal'})),
 ...['Impuestos','Cuota autónomo','Gestoría','Software y herramientas','Otros'].map(n=>({nombre:n,tipo:'Gasto',ambito:'Sporture'})),
 {nombre:'Freelance',tipo:'Ingreso',ambito:'Personal'},{nombre:'Otros',tipo:'Ingreso',ambito:'Personal'},{nombre:'Sporture',tipo:'Ingreso',ambito:'Sporture'},{nombre:'LaLiga',tipo:'Ingreso',ambito:'LaLiga'}];

let cfg=LS.get('cfg',null);
let db=LS.get('db',{movimientos:[],categorias:[],personas:[],deuda:[]});
let queue=LS.get('queue',[]), delQ=LS.get('delq',[]);
const persist=()=>{LS.set('db',db);LS.set('queue',queue);LS.set('delq',delQ)};

/* ---------- red ---------- */
// Cualquier fallo se reduce a un código interno; el texto crudo del error nunca llega a la pantalla.
const syncErr=code=>Object.assign(new Error(code),{code});
const STOP_CODES=['clave','bloqueado','config'];   // no se reintentan solos
async function api(body){
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),25000); let txt;
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,...body}),signal:ctl.signal});
    txt=await r.text();
  }catch{ throw syncErr('red') } finally{ clearTimeout(t) }
  let j; try{ j=JSON.parse(txt) }catch{ throw syncErr('formato') }
  if(!j||typeof j!=='object') throw syncErr('formato');
  if(!j.ok) throw syncErr([...STOP_CODES,'datos'].includes(j.error)?j.error:'servidor');
  return j;
}
const RETRY=[2000,5000,15000,45000];   // espera antes de cada reintento automático (5 intentos en total)
let syncing=false, again=false, attempt=0, retryT=null, halt=null, lastSync=LS.get('lastsync',0), rejected=LS.get('rejected',[]), syncState={k:'idle'};
const STOP_MSG={clave:'La clave no es correcta',bloqueado:'Demasiados intentos, espera unos 15 minutos',config:'Falta configurar el script'};
function setPill(k,code){syncState={k,code};renderPill()}
function ago(t){
  if(!t) return 'aún sin sincronizar';
  const m=Math.max(0,Math.floor((Date.now()-t)/60000));
  if(m<1) return 'hace un momento'; if(m<60) return `hace ${m} min`;
  const h=Math.floor(m/60); return h<24?`hace ${h} h`:`hace ${Math.floor(h/24)} d`;
}
function renderPill(){
  const b=$('#sync'), n=queue.length+delQ.length, k=syncState.k, off=!navigator.onLine||k==='off', nr=rejected.length;
  let label, cls='', note=`Última sincronización: ${ago(lastSync)}`;
  if(!cfg){label='Sin configurar'; cls='wait'; note='Toca para conectar'}
  else {
    if(k==='sync'){label='Sincronizando…'; cls='wait'}
    else if(off){label='Sin conexión'; cls='off'; if(n) note=`${n} en cola · última: ${ago(lastSync)}`}
    else if(n){label=`Pendiente (${n})`; cls='wait'}
    else if(k==='retry'||k==='fail'||k==='stop') label='Sin sincronizar';
    else label='Sincronizado';
    if(k==='retry'&&!off){note='No se pudo sincronizar, reintentando…'; cls='wait'}
    else if(k==='fail'&&!off){note='No se pudo sincronizar. Toca para reintentar.'; cls='err'}
    else if(k==='stop'){note=STOP_MSG[syncState.code]||'No se pudo sincronizar'; cls='err'}
    else if(nr&&k!=='sync'){note=`${nr} movimiento${nr>1?'s':''} no válido${nr>1?'s':''}. Toca para revisar.`; cls='err'}
  }
  b.className='syncbtn '+cls+(k==='sync'?' spin':'');
  $('#syncL').textContent=label; $('#syncN').textContent=note;
  b.setAttribute('aria-label',`Sincronizar ahora. ${label}. ${note}`);
}
function showRejected(){
  openSheet(`<h2>Movimientos no válidos</h2><p>No se han podido guardar en la hoja. Se han apartado para que no se pierdan: revísalos y vuelve a registrarlos si hace falta.</p>${rejected.map(m=>`<p><b>${esc(m.descripcion)}</b><br>${esc(m.monto)} € · ${esc(m.categoria)} · ${esc(m.fecha)}</p>`).join('')}<div class="btns"><button class="secondary" id="sNo">Cerrar</button><button class="primary danger" id="sDel">Descartar</button></div>`);
  $('#sNo').onclick=()=>{closeSheet();sync(true)};
  $('#sDel').onclick=()=>{rejected=[];LS.set('rejected',rejected);closeSheet();sync(true)};
}
// Disparador nuevo (abrir, guardar, volver la conexión, volver a la app, tocar el botón): empieza la cuenta de reintentos de cero.
function sync(force){ clearTimeout(retryT); retryT=null; attempt=0; return run(force) }
async function run(force){
  if(!cfg) return;
  if(syncing){again=true;return}   // solo una a la vez; lo que llegue mientras tanto se envía justo al terminar
  if(halt&&!force){ if(halt.code==='bloqueado'&&Date.now()>halt.until) halt=null; else return }   // no insistir con una clave mala
  if(!navigator.onLine&&!force){setPill('off');return}
  syncing=true; again=false; setPill('sync');
  let ok=false, code='red', apartados=0;
  // Un envío aceptado: si se deshizo mientras viajaba, ya está en el Sheet y se manda a borrar.
  const enviado=items=>{
    for(const b of items) if(!queue.some(x=>x.id===b.id)) delQ.push(b.id);
    queue=queue.filter(x=>!items.some(b=>b.id===x.id)); persist();
  };
  try{
    while(delQ.length){ const id=delQ[0]; await api({action:'delete',id}); delQ=delQ.filter(x=>x!==id); persist() }   // ok aunque la fila ya no exista
    if(queue.length){
      const batch=queue.slice();
      try{ await api({action:'add',items:batch}); enviado(batch) }
      catch(e){
        if(e.code!=='datos') throw e;
        // Hay un movimiento inválido en el lote: se prueban de uno en uno (el mismo id no se duplica) y solo se aparta el malo.
        for(const it of batch){
          try{ await api({action:'add',items:[it]}); enviado([it]) }
          catch(e2){
            if(e2.code!=='datos') throw e2;
            if(queue.some(x=>x.id===it.id)){ queue=queue.filter(x=>x.id!==it.id); rejected.push(it); LS.set('rejected',rejected); persist(); apartados++ }
          }
        }
      }
    }
    const d=await api({action:'data'}), dels=new Set(delQ.map(String));
    db={movimientos:(d.movimientos||[]).filter(m=>!dels.has(String(m.id))),categorias:d.categorias||[],personas:d.personas||[],deuda:d.deuda||[]};
    for(const q of queue) if(!db.movimientos.some(m=>m.id===q.id)) db.movimientos.push(q);
    idx=null; persist(); ok=true;
  }catch(e){ code=(e&&e.code)||'red' }
  finally{ syncing=false }
  if(ok){ attempt=0; halt=null; lastSync=Date.now(); LS.set('lastsync',lastSync); setPill('ok'); renderAll();
    if(apartados) toast(`${apartados>1?apartados+' movimientos no se han':'Un movimiento no se ha'} podido guardar y se ha apartado. Toca el indicador para verlo.`) }
  else if(STOP_CODES.includes(code)){ halt={code,until:Date.now()+15*60000}; setPill('stop',code) }
  else if(!navigator.onLine) setPill('off');
  else if(attempt<RETRY.length){ setPill('retry'); retryT=setTimeout(()=>{retryT=null;attempt++;run()},RETRY[attempt]) }
  else setPill('fail');
  if(again){again=false; if(queue.length||delQ.length) sync()}   // se guardó algo mientras sincronizaba
}

/* ---------- datos derivados ---------- */
const cats=()=>db.categorias&&db.categorias.length?db.categorias:DEFAULT_CATS;
const STOP=new Set(['con','una','uno','los','las','del','por','para','que','mas','sin','el','la','de','en','y','al']);
const tok=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!STOP.has(w));
let idx=null;
function buildIdx(){idx={};for(const m of db.movimientos){const k=m.tipo+'|'+m.ambito;const o=idx[k]||(idx[k]={});for(const w of new Set(tok(m.descripcion))){const c=o[w]||(o[w]={});c[m.categoria]=(c[m.categoria]||0)+1}}}
function suggest(text){
  if(!idx) buildIdx(); const o=idx[st.tipo+'|'+st.ambito]; if(!o) return null; const sc={};
  for(const w of new Set(tok(text))){const c=o[w]; if(!c) continue; const tot=Object.values(c).reduce((a,b)=>a+b,0);
    for(const [cat,n] of Object.entries(c)) sc[cat]=(sc[cat]||0)+(n/tot)*Math.min(1,Math.log2(tot+1)/2)}
  let best=null,bs=0; for(const [c,s] of Object.entries(sc)) if(s>bs){best=c;bs=s}
  return bs>=0.5?best:null;
}
function recentCounts(field,tipo,ambito,days=120){
  const lim=new Date(Date.now()-days*864e5).toISOString().slice(0,10), c={};
  for(const m of db.movimientos){ if(m.fecha<lim) continue; if(tipo&&m.tipo!==tipo) continue; if(ambito&&m.ambito!==ambito) continue;
    const vals=field==='personas'?String(m.personas||'').split(',').map(s=>s.trim()).filter(Boolean):[m.categoria];
    for(const v of vals) c[v]=(c[v]||0)+1 }
  return c;
}
function personaMatchers(){
  return db.personas.map(p=>{const names=[p.nombre,...String(p.alias||'').split(',').map(s=>s.trim()).filter(Boolean)].map(norm).filter(Boolean);
    return {nombre:p.nombre,re:new RegExp('(^|[^a-z0-9])('+names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')($|[^a-z0-9])')}});
}

  <div id="cerr" class="err" hidden></div>
  <div class="btns">${first===true?'':'<button class="secondary" id="sNo">Cerrar</button>'}<button class="primary" id="sOk">Conectar</button></div>
  ${first===true?'':'<div class="btns"><button class="secondary" id="sReset" style="width:100%;height:46px">Borrar datos de este móvil</button></div>'}`);
  if($('#sNo')) $('#sNo').onclick=closeSheet;
  if($('#sReset')) $('#sReset').onclick=()=>{if(confirm('Se borra la copia local y los movimientos sin sincronizar. ¿Seguir?')){localStorage.clear();location.reload()}};
  $('#sOk').onclick=async()=>{
    const url=$('#cu').value.trim(), key=$('#ck').value.trim(), er=$('#cerr'); er.hidden=true;
    if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(url)){er.textContent='La URL debe empezar por https://script.google.com y terminar en /exec.';er.hidden=false;return}
    if(!key){er.textContent='Escribe la clave.';er.hidden=false;return}
    $('#sOk').disabled=true; $('#sOk').textContent='Conectando…';
    const old=cfg; cfg={url,key};
    try{await api({action:'ping'});
      LS.set('cfg',cfg); halt=null; closeSheet(); await sync(); renderAll(); toast('Conectado')}
    catch(e){cfg=old; $('#sOk').disabled=false; $('#sOk').textContent='Conectar';
      er.textContent=e.code==='clave'?'La clave no coincide con la del código de Apps Script.':e.code==='bloqueado'?'Demasiados intentos, espera unos 15 minutos.':e.code==='config'?'Falta configurar el script.':'No se pudo conectar. Revisa la URL y que el acceso de la implementación sea «Cualquier usuario».'; er.hidden=false}
  };
}
function openSheet(html){ $('#sheet').innerHTML=html; $('#scrim').classList.add('on') }
function closeSheet(){ $('#scrim').classList.remove('on') }
$('#scrim').onclick=e=>{if(e.target.id==='scrim'&&cfg) closeSheet()};

/* ---------- navegación ---------- */
const TITLES={add:'Registrar',sum:'Resumen',his:'Historial'};
function tab(t){
  if(t!=='add'&&st.editId&&!(t==='his'&&!$('#v-add').classList.contains('on'))) resetForm();
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  $$('.tabs button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.tab===t)); $$('.tabs button').forEach(b=>{if(b.dataset.tab===t) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current')});
  $('#title').textContent=TITLES[t]; $('#main').scrollTop=0; LS.set('tab',t);
  if(t==='sum') renderSum(); if(t==='his') renderHis();
}
function renderAll(){ renderAdd(); const t=LS.get('tab','add'); if(t==='sum') renderSum(); if(t==='his') renderHis(); renderPill() }
$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$('#sync').onclick=()=>{if(!cfg) openSettings(true); else if(rejected.length) showRejected(); else if(!syncing) sync(true)};
window.addEventListener('online',()=>sync()); window.addEventListener('offline',()=>{setPill('off')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ sync(); renderPill() }});
setInterval(renderPill,30000);

/* ---------- arranque ---------- */
(function boot(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('u')&&h.get('k')){cfg={url:h.get('u'),key:h.get('k')};LS.set('cfg',cfg);history.replaceState(null,'',location.pathname)}
  initAdd(); renderAdd(); tab('add'); renderPill();
  if(cfg){ sync() } else { openSettings(true) }
  if('serviceWorker' in navigator){
    // Si ya había una versión controlando la app y llega otra nueva, avisa (sin recargar solo, por si estás escribiendo).
    const hadSW=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadSW) $('#upd').hidden=false });
    $('#upd').onclick=()=>location.reload();
    navigator.serviceWorker.register('sw.js').then(reg=>{
      document.addEventListener('visibilitychange',()=>{if(!document.hidden) reg.update().catch(()=>{})});
    }).catch(()=>{});
  }
})();
</script>
</body>
