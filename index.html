/* ---------- temas ----------
   bg/ink/muted: texto directamente sobre el fondo. card/cink/cmuted: dentro de tarjetas, fichas y teclas. */
:root,[data-tema=personal]{
  --bg:#F4F5F2; --ink:#1F2328; --muted:#5F6B67; --ph:#7C8682;
  --card:#FFFFFF; --cink:#1F2328; --cmuted:#5F6B67; --line:#DCE1DD; --inp:#F4F5F2;
  --track:#E9ECE8; --act-bg:#1F2328; --act-fg:#FFFFFF; --focus:#1F2328;
  --tab-bg:#FFFFFF; --tab-ink:#5F6B67; --tab-on:#1F2328; --tab-ico:#8A5A2B; --tab-line:#DCE1DD;
  --bad:#B3361A; --cbad:#B3361A; --dbg:#A8321A; --good:#2F7A4F;
  --fill:#1F2328; --bar2:#E6E9E6; --cbar:#86918C;
  --toast-bg:#1F2328; --toast-fg:#FFFFFF;
  --dis-bg:#E1E5E0; --dis-fg:#454F4B; --dis-line:#BFC7C1;
}
[data-tema=sporture]{
  --bg:#283764; --ink:#FFFFFF; --muted:#AEAEB2; --ph:#8A93AD;
  --card:#FFFFFF; --cink:#283764; --cmuted:#5A6485; --line:#E1E5EF; --inp:#F1F3F8;
  --track:#1F2B4A; --act-bg:#CDB470; --act-fg:#283764; --focus:#CDB470;
  --tab-bg:#1F2B4A; --tab-ink:#D8D8D8; --tab-on:#CDB470; --tab-ico:#CDB470; --tab-line:#34437A;
  --bad:#FF9C8A; --cbad:#B3361A; --dbg:#A8321A; --good:#6FD39C;
  --fill:#283764; --bar2:#E3E7F0; --cbar:#7C88AD;
  --toast-bg:#FFFFFF; --toast-fg:#283764;
  --dis-bg:#44527F; --dis-fg:#F2F4FA; --dis-line:#6A77A3;
}
[data-tema=laliga]{
  --bg:#17171B; --ink:#F5F5F7; --muted:#A1A1AA; --ph:#6B6B75;
  --card:#222228; --cink:#F5F5F7; --cmuted:#A1A1AA; --line:#34343C; --inp:#17171B;
  --track:#101013; --act-bg:#D63B45; --act-fg:#FFFFFF; --focus:#FF6B73;
  --tab-bg:#101013; --tab-ink:#A1A1AA; --tab-on:#FF6B73; --tab-ico:#FF6B73; --tab-line:#26262C;
  --bad:#FF8A80; --cbad:#FF8A80; --dbg:#C9323C; --good:#5FD08F;
  --fill:#D63B45; --bar2:#34343C; --cbar:#6E6E7A;
  --toast-bg:#2E2E36; --toast-fg:#F5F5F7;
  --dis-bg:#34343C; --dis-fg:#C9C9D1; --dis-line:#4A4A54;
}
:root{
  --sans:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:var(--sans);
  --sat:env(safe-area-inset-top,0); --sab:env(safe-area-inset-bottom,0);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{font-size:calc(var(--fs,1) * 16px)}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.4 var(--sans);overscroll-behavior:none;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:0.75rem}
#app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;position:relative}
header{flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 1rem;min-height:calc(var(--sat) + 3.25rem);padding:calc(var(--sat) + .5rem) 24px 0}
header h1{font:700 1.375rem/1.3 var(--sans);margin:0;letter-spacing:-.01em;min-width:0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#upd{margin:0 24px 0.5rem;min-height:2.75rem;border-radius:1rem;background:var(--act-bg);color:var(--act-fg);font-size:0.9062rem}
#upd[hidden]{display:none}
/* indicador de sincronización (Fase 1) */
.syncbtn{flex:none;display:flex;align-items:center;justify-content:flex-end;min-width:2.75rem;min-height:2.75rem;max-width:100%;margin-left:auto;color:var(--ink);text-align:right}
.syncbtn .vis{display:flex;align-items:center;gap:0.5rem;padding:0.25rem 0.75rem;min-height:2.5rem;border-radius:0.875rem;background:var(--track);transition:padding .25s,gap .25s,min-height .25s,border-radius .25s,box-shadow .25s,background-color .35s}
.syncbtn svg{width:1.25rem;height:1.25rem;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:width .25s,height .25s}
.syncbtn .st{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2;min-width:0;max-width:14.375rem;max-height:2.25rem;overflow:hidden;white-space:nowrap;transition:max-width .25s,max-height .25s,opacity .2s}
.syncbtn b{font-size:0.875rem;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.syncbtn small{font-size:0.7188rem;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.syncbtn .dot{width:0;height:0.4375rem;border-radius:50%;background:var(--good);flex:none;transition:width .25s}
.syncbtn.wait .vis{box-shadow:inset 0 0 0 1.5px var(--act-bg)}
.syncbtn.err .vis{box-shadow:inset 0 0 0 1.5px var(--bad)} .syncbtn.err small{color:var(--bad)}
.syncbtn.off svg{color:var(--muted)}
.syncbtn.spin svg{animation:spin 1s linear infinite}
.syncbtn.compact .vis{padding:0.375rem 0.625rem;gap:0.375rem;min-height:0;border-radius:6.1875rem}
.syncbtn.compact svg{width:0.9375rem;height:0.9375rem;color:var(--muted)}
.syncbtn.compact .st{max-width:0;max-height:0;opacity:0}
.syncbtn.compact .dot{width:0.4375rem}
@keyframes spin{to{transform:rotate(360deg)}}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 24px 24px}
#v-sum,#v-his{padding-top:0.5rem}
.view{display:none} .view.on{display:block}
#v-add.on{display:flex;flex-direction:column;gap:0.5rem;padding-top:0.25rem}
/* barra inferior */
#navwrap{flex:none;position:relative}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--tab-bg);border-top:1px solid var(--tab-line);padding:2px 1rem calc(var(--sab) + 2px)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:0.75rem;font-weight:600;color:var(--tab-ink);border-radius:1rem;min-height:2.75rem}
.tabs button svg{width:1.5rem;height:1.5rem;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current=page]{color:var(--tab-on);font-weight:700}
.tabs button[aria-current=page] svg{stroke:var(--tab-ico)}
/* controles */
.seg{display:flex;flex-wrap:wrap;background:var(--track);border-radius:1rem;padding:2px;gap:2px}
.seg button{flex:1 1 0;min-height:2.75rem;border-radius:0.875rem;font-weight:600;font-size:0.9375rem;color:var(--muted);padding:0 0.5rem;min-width:max-content}
.seg button.on{background:var(--act-bg);color:var(--act-fg)}
.card .seg{background:var(--inp)} .card .seg button{color:var(--cmuted)} .card .seg button.on{color:var(--act-fg)}
.chips{display:flex;gap:0.5rem;overflow-x:auto;margin:0 -24px;padding:0 24px;scroll-padding:0 24px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chips :focus-visible{outline-offset:-3px}
.chip{flex:none;min-height:2.75rem;padding:0 1rem;border-radius:6.1875rem;background:var(--card);color:var(--cink);border:1.5px solid var(--line);font-size:0.9375rem;font-weight:600;white-space:nowrap;scroll-snap-align:start}
.chip.on{background:var(--act-bg);border-color:var(--act-bg);color:var(--act-fg)}
.chip.ghost{background:transparent;border-style:dashed;color:var(--muted);border-color:var(--muted)}
.lbl{font-size:0.8125rem;font-weight:600;line-height:1rem;color:var(--muted);margin:0 0 0.25rem;display:flex;gap:0.5rem;align-items:baseline}
.lbl em{font-style:normal;color:var(--ink);font-weight:700}
/* captura */
.row2{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center}
.row2 .seg{flex:1 1 auto;min-width:0}
.row2 .chip{padding:0 0.75rem}
.amount{display:flex;justify-content:center;align-items:baseline;gap:8px;font:700 60px/60px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:0;min-height:60px}
.amount .cur{font-size:28px;color:var(--muted);font-weight:600}
.amount.empty #amtTxt{color:var(--ph)}
.desc{width:100%;min-height:3rem;border-radius:1rem;border:1.5px solid var(--line);background:var(--card);color:var(--cink);padding:0 1rem;font-size:1.0625rem}
.desc::placeholder{color:var(--cmuted)}
.desc:focus{border-color:var(--act-bg);outline:none}
.dateBtn{position:relative;cursor:pointer;display:flex;align-items:center;gap:0.375rem}
.dateBtn svg{width:1.125rem;height:1.125rem;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dateBtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:0.375rem 0.5rem;margin-top:0}
.pad button{min-height:2.75rem;border-radius:1rem;background:var(--card);color:var(--cink);font:600 1.375rem var(--sans);box-shadow:0 1px 0 var(--line)}
.pad button:active{filter:brightness(.92)}
/* botón Guardar fijo, encima de la barra */
#dock{flex:none;position:relative;padding:0.5rem 24px 0.25rem;background:var(--bg)}
.primary{width:100%;min-height:3.5rem;border-radius:1.125rem;background:var(--act-bg);color:var(--act-fg);font-weight:700;font-size:1.0625rem}
.primary:disabled{background:var(--dis-bg);color:var(--dis-fg);box-shadow:inset 0 0 0 1.5px var(--dis-line);cursor:not-allowed}
#app.typing .pad,#app.typing .tabs,#app.typing #peopleBox,#app.typing #reembBox,#app.typing #ambSeg,#app.typing #bk{display:none}
/* tarjetas */
.card{background:var(--card);color:var(--cink);border-radius:1.5rem;padding:1.5rem 1.25rem;margin-top:1rem}
.card h2{font:700 1.0625rem var(--sans);margin:0 0 0.25rem}
.card .sub{font-size:0.8125rem;color:var(--cmuted);margin:0 0 1rem}
.big{font:700 44px/1.05 var(--sans);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.delta{font-size:0.875rem;margin-top:0.5rem;color:var(--cmuted)}
.delta b{font-weight:700}
.up{color:var(--cbad)} .down{color:var(--cink)}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:0.5rem 0 0}
.monthnav button{min-width:2.75rem;min-height:2.75rem;border-radius:0.875rem;font-size:1.375rem;color:var(--ink)}
.monthnav button:disabled{opacity:.3}
.monthnav strong{font:700 1.125rem var(--sans);flex:1;text-align:center}
.row{display:grid;grid-template-columns:1fr auto;gap:0.25rem 0.75rem;padding:0.75rem 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-of-type{border-top:0}
.row .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font:600 0.9375rem var(--sans);font-variant-numeric:tabular-nums;text-align:right}
.row .v small{color:var(--cmuted);font-weight:400;margin-left:0.5rem}
.bar{grid-column:1/-1;height:0.5rem;border-radius:0.25rem;background:var(--bar2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fill);border-radius:0.25rem}
.detail{padding:0 0 0.5rem 0;font-size:0.875rem}
.detail div{display:flex;justify-content:space-between;gap:0.75rem;padding:0.375rem 0;color:var(--cmuted)}
.detail div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail div span:last-child{font-variant-numeric:tabular-nums;color:var(--cink)}
#perSeg button{font-size:0.875rem;padding:0 0.5rem;white-space:nowrap}
select{background:var(--inp);color:var(--cink);border:0;border-radius:0.75rem;min-height:2.75rem;padding:0 0.75rem;font-size:0.875rem;max-width:55%}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0.5rem;margin-bottom:0.5rem}
.note{font-size:0.7812rem;color:var(--cmuted);margin:1rem 0 0}
svg text{font-family:var(--sans)}
/* historial */
.day{font-size:0.8125rem;font-weight:600;color:var(--muted);margin:1.5rem 0 0.5rem}
.mov{display:grid;grid-template-columns:1fr auto;gap:0 0.75rem;width:100%;text-align:left;background:var(--card);color:var(--cink);padding:0.75rem 1rem;border-radius:1.25rem;margin-bottom:0.5rem;min-height:4rem}
.mov .d{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .s{font-size:0.8125rem;color:var(--cmuted);grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .a{grid-row:1/3;grid-column:2;font:700 1rem var(--sans);align-self:center;font-variant-numeric:tabular-nums}
/* ventana inferior + aviso */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#scrim.on{display:flex}
#sheet{background:var(--card);color:var(--cink);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:24px 24px calc(var(--sab) + 24px);max-height:88dvh;overflow:auto}
#sheet h2{font:700 1.25rem var(--sans);margin:0 0 0.5rem}
#sheet p{color:var(--cmuted);margin:0 0 1rem;font-size:0.9062rem}
#sheet label{display:block;font-size:0.8125rem;font-weight:600;color:var(--cmuted);margin:1rem 0 0.5rem}
#sheet input{width:100%;min-height:3rem;border-radius:0.875rem;border:1.5px solid var(--line);background:var(--inp);color:var(--cink);padding:0 1rem;font-size:1rem}
#sheet .err{color:var(--cbad);font-size:0.875rem;margin-top:1rem}
#sheet .btns{display:flex;gap:0.5rem;margin-top:1.5rem}
#sheet .btns .primary{margin:0}
.secondary{min-height:3.5rem;padding:0 1.25rem;border-radius:1.125rem;background:var(--inp);color:var(--cink);border:1.5px solid var(--line);font-weight:600}
.primary.danger{background:var(--dbg);color:#fff}
#toast{position:absolute;left:50%;bottom:100%;margin-bottom:0.5rem;transform:translate(-50%,1rem);background:var(--toast-bg);color:var(--toast-fg);padding:0.25rem 0.5rem 0.25rem 1rem;border-radius:1rem;display:flex;align-items:center;gap:0.5rem;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s .2s,transform .2s,background-color .35s,color .35s;z-index:30;width:max-content;max-width:calc(100vw - 2rem);font-size:0.9375rem;box-shadow:0 0.25rem 1rem rgba(0,0,0,.18)}
#toast.on{opacity:1;visibility:visible;transition-delay:0s;transform:translate(-50%,0);pointer-events:auto}
#toast button{font-weight:700;min-height:2.75rem;padding:0 0.75rem;border-radius:0.75rem;text-decoration:underline}
/* tamaño de letra del sistema (iOS): solo la medida base, la fuente sigue siendo Open Sans */
#fsprobe{position:absolute;left:-9999px;top:0;visibility:hidden;pointer-events:none;font-size:16px;font:-apple-system-body;font-family:var(--sans)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#sheet:focus{outline:none}
svg g[data-ym]{outline:none} svg g[data-ym]:focus-visible rect{stroke:var(--focus);stroke-width:2}
/* estados vacíos */
.vacio{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.5rem;padding:1rem .5rem}
.card .vacio{padding:.5rem 0}
.vacio svg{width:2rem;height:2rem;stroke:var(--cmuted);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.vacio h3{font:700 1.0625rem/1.3 var(--sans);margin:.25rem 0 0;color:var(--cink)}
.vacio p{margin:0;font-size:.875rem;color:var(--cmuted)}
.vacio .chip{margin-top:.75rem}
/* etiqueta de reembolso (siempre con texto, no solo color) */
.mov .t{grid-column:1;grid-row:3;margin-top:.25rem}
.tag{display:inline-block;padding:.0625rem .5rem;border-radius:99px;font-size:.75rem;font-weight:700;line-height:1.4;box-shadow:inset 0 0 0 1.5px currentColor}
.tag-p{color:var(--cink)} .tag-r{color:var(--cmuted)} .tag-a{background:var(--act-bg);color:var(--act-fg);box-shadow:none}
/* aviso mensual de copia */
.bk{display:flex;flex-direction:column;gap:.5rem;margin:.5rem 0 .25rem;padding:.75rem .875rem;border-radius:1.5rem;background:var(--card);color:var(--cink);border:1.5px solid var(--line)}
.bk .bkt{display:flex;flex-direction:column;line-height:1.3}
.bk b{font-size:.9375rem;font-weight:700}
.bk span{font-size:.8125rem;color:var(--cmuted)}
.bk .bkb{display:flex;flex-wrap:wrap;gap:.5rem}
.bk button{flex:1 1 auto;min-height:2.75rem;padding:0 1rem;border-radius:99px;font-size:.9375rem;font-weight:600}
.bk #bkOk{background:var(--act-bg);color:var(--act-fg)}
.bk #bkLater{background:var(--inp);color:var(--cink);box-shadow:inset 0 0 0 1.5px var(--line)}
.bkrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem .75rem;margin-top:1.5rem;font-size:.8125rem;color:var(--cmuted)}
.chip:disabled{background:var(--dis-bg);color:var(--dis-fg);border-color:var(--dis-line);cursor:default}
/* resumen: indicadores y secciones que se abren y cierran */
.perseg{margin-top:.5rem}
.hero .kl{font-size:.8125rem;font-weight:600;color:var(--cmuted);margin:0 0 .25rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.75rem 1rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--line)}
.kpi{min-width:0}
.kpi span{display:block;font-size:.8125rem;color:var(--cmuted)}
.kpi b{display:block;font:700 1.25rem/1.25 var(--sans);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi b.neg{color:var(--cbad)}
.kpi small{display:block;font-size:.8125rem;color:var(--cmuted)}
.card.sec{padding:0}
.card .sh{margin:0}
.sh button{display:flex;align-items:center;justify-content:space-between;gap:.75rem;width:100%;min-height:3.5rem;padding:.75rem 1.25rem;text-align:left;border-radius:1.5rem}
.sh button:focus-visible{outline-offset:-3px}
.sh .stt{display:block;font:700 1.0625rem/1.3 var(--sans)}
.sh .ssum{display:block;font:400 .8125rem/1.3 var(--sans);color:var(--cmuted)}
.sec[data-open=true] .ssum{display:none}
.chev{width:1.25rem;height:1.25rem;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.sec[data-open=true] .chev{transform:rotate(180deg)}
.spw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
.sec[data-open=true] .spw{grid-template-rows:1fr}
.sp{min-height:0;overflow:hidden;padding:0 1.25rem;visibility:hidden;transition:visibility 0s .2s}   /* cerrada: no se puede enfocar ni leer */
.sec[data-open=true] .sp{visibility:visible;transition-delay:0s}
.sp-in{padding:.25rem 0 1.5rem}
/* deuda: pagos */
.sec-foot{padding:0 1.25rem 1.25rem;display:flex;flex-direction:column;gap:.5rem}
.sec-foot .primary{min-height:3rem}
.sec-foot .secondary{min-height:2.75rem;padding:0 1rem;font-size:.9375rem;border-radius:1rem}
.ph{font:700 .9375rem var(--sans);margin:1.25rem 0 .25rem}
.pagos{list-style:none;margin:0;padding:0}
.pago{display:flex;align-items:center;gap:.75rem;padding:.5rem 0;border-top:1px solid var(--line)}
.pago:first-child{border-top:0}
.pg{flex:1;min-width:0}
.pl{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .5rem}
.pl b{font-variant-numeric:tabular-nums}
.pg .pf{display:block;font-size:.8125rem;color:var(--cmuted);overflow-wrap:anywhere}
.delp{flex:none;min-width:2.75rem;min-height:2.75rem;display:flex;align-items:center;justify-content:center;border-radius:.875rem;color:var(--cmuted)}
.delp svg{width:1.25rem;height:1.25rem;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#verPagos{margin-top:.5rem}
#sheet .aviso{font-size:.875rem;color:var(--cink);background:var(--inp);border-radius:.75rem;padding:.5rem .75rem;margin-top:.5rem}
#sheet #smr{position:sticky;top:0;z-index:2;margin:.25rem 0 0;box-shadow:0 6px 8px -6px rgba(0,0,0,.25)}   /* los resultados se quedan a la vista aunque se desplace la hoja o haya teclado */
#sheet .cnt{font-size:.8125rem;color:var(--cmuted);text-align:right;margin-top:.25rem}
/* margen */
.mrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.125rem .75rem;padding:.75rem 0;border-top:1px solid var(--line)}
.mrows>.mrow:first-child{border-top:0}
.ml{font-size:.9375rem;color:var(--cink);min-width:0;overflow-wrap:anywhere}
.mv{font:700 1.125rem/1.25 var(--sans);font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere;max-width:100%}
.mv.neg{color:var(--cbad)}
.ms{flex:1 0 100%;font-size:.8125rem;color:var(--cmuted)}
.mbtn{min-height:2.75rem;padding:0 1rem;border-radius:1rem;font-size:.9375rem;margin-top:.5rem;max-width:100%}
.mrow .mbtn{flex:1 0 100%}
#btnSim{margin-top:1rem;width:100%}
/* cambio de tema suave */
body,header h1,.tabs,.tabs button,.seg,.seg button,.chip,.card,.pad button,.desc,.primary,.secondary,.mov,.bk,.bk button,#dock,#sheet,.amount .cur{transition:background-color .35s,color .35s,border-color .35s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important} .syncbtn.spin svg{animation:none}}
</style>

<body>
<div id="fsprobe" aria-hidden="true"></div>
<div id="sr" class="sr-only" role="status" aria-live="polite"></div>
<div id="app" class="">
  <header><h1 id="title">Registrar</h1><button class="syncbtn" id="sync" type="button" aria-label="Sincronizar ahora"><span class="vis"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg><span class="st"><b id="syncL">Sin configurar</b><small id="syncN"></small></span><i class="dot" aria-hidden="true"></i></span></button></header>
  <button id="upd" hidden>Hay una versión nueva · <b>Actualizar</b></button>
  <main id="main">
    <div id="bk" class="bk" role="status" hidden>
      <div class="bkt"><b id="bkT">Toca la copia mensual de tu hoja</b><span id="bkP"></span></div>
      <div class="bkb"><button id="bkOk" aria-label="Ya la hice: guardar la fecha de hoy como última copia">Ya la hice</button><button id="bkLater" aria-label="Recordar mañana: ocultar el aviso hasta mañana">Recordar mañana</button></div>
    </div>
    <section class="view on" id="v-add" aria-label="Registrar movimiento">
      <div class="seg" id="ambSeg" role="group" aria-label="Ámbito"></div>
      <div class="row2"><div class="seg" id="tipoSeg" role="group" aria-label="Tipo"><button data-v="Gasto" class="on" aria-pressed="true">Gasto</button><button data-v="Ingreso" aria-pressed="false">Ingreso</button></div><label class="chip dateBtn" id="dateBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg><span id="dateTxt">Hoy</span><input type="date" id="dateIn" aria-label="Cambiar fecha"></label><button class="chip" id="yBtn" aria-pressed="false">Ayer</button></div>
      <div class="amount empty" id="amount" aria-live="polite" aria-label="Monto"><span id="amtTxt">0</span><span class="cur">€</span></div>
      <input class="desc" id="desc" placeholder="¿Qué y dónde? Ej: pizza en Antonias" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" aria-label="Descripción">
      <div class="chips" id="cats" role="group" aria-label="Categoría"></div>
      <div id="peopleBox"><div class="lbl">Con quién <span>(opcional)</span></div>
      <div class="chips" id="people"></div></div>
      <div id="reembBox" hidden><div class="lbl">Reembolso <span>(opcional)</span></div>
      <div class="chips" id="reemb" role="group" aria-label="Reembolso"></div></div>
      <div class="pad" id="pad"></div>
    </section>
    <section class="view" id="v-sum" aria-label="Resumen"></section>
    <section class="view" id="v-his" aria-label="Historial"></section>
  </main>
  <div id="dock"><button class="primary" id="save" disabled>Guardar</button></div>
  <div id="navwrap"><nav class="tabs" aria-label="Secciones">
    <button data-tab="add" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Registrar</button>
    <button data-tab="sum"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Resumen</button>
    <button data-tab="his"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Historial</button>
  </nav></div>
</div>
<div id="scrim"><div id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<div id="toast"><span id="toastTxt"></span><button id="toastBtn">Deshacer</button></div>

<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const eur=(n,d=2)=>new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const eur0=n=>eur(n,0);
const pad2=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const yesterdayStr=()=>{const d=new Date();d.setDate(d.getDate()-1);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

/* ---------- tamaño de letra del sistema y avisos para el lector de pantalla ---------- */
function fitText(){
  const px=parseFloat(getComputedStyle($('#fsprobe')).fontSize)||17;
  document.documentElement.style.setProperty('--fs',Math.min(1.3,Math.max(1,px/17)).toFixed(3));
}
let sayT=null, sayBuf=[];
function say(msg){
  sayBuf.push(msg); clearTimeout(sayT);
  sayT=setTimeout(()=>{const t=sayBuf.map(m=>m.replace(/[.\s]+$/,'')).join('. '); sayBuf=[]; const r=$('#sr'); r.textContent=''; setTimeout(()=>{r.textContent=t},40)},250);   // los avisos casi simultáneos se leen juntos
}

/* ---------- aviso mensual de copia del Sheet (la fecha vive solo en este móvil) ---------- */
const BK_INICIAL='2026-10-18', BK_DESDE=27, BK_HASTA=34;
const fechaOk=v=>{
  if(typeof v!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(v)) return false;
  const [y,m,d]=v.split('-').map(Number), t=new Date(Date.UTC(y,m-1,d));
  return t.getUTCFullYear()===y&&t.getUTCMonth()===m-1&&t.getUTCDate()===d;
};
const fechaLarga=v=>{const [y,m,d]=v.split('-').map(Number); return `${d} de ${MES[m-1]} de ${y}`};
function ultimaCopia(){const v=LS.get('bk',null); return fechaOk(v)&&v<=todayStr()?v:BK_INICIAL}   // guardada corrupta o futura: se ignora
function diasCopia(){   // días de calendario con la fecha local, sin horas ni UTC
  const a=ultimaCopia().split('-').map(Number), b=todayStr().split('-').map(Number);
  return Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/864e5);
}
let bkDicho='';
function renderCopia(){
  const n=diasCopia(), on=($('.view.on')||{}).id;
  const ver=!!cfg&&(on==='v-sum'||on==='v-his')&&n>=BK_DESDE&&n<=BK_HASTA&&LS.get('bksnz',null)!==todayStr();
  $('#bk').hidden=!ver; if(!ver) return;
  const frase=`Hace ${n} ${n===1?'día':'días'} de la última copia.`;
  $('#bkP').textContent=frase;
  const k=ultimaCopia()+'|'+todayStr(); if(k!==bkDicho){bkDicho=k; say('Toca la copia mensual de tu hoja. '+frase)}   // role="status" no siempre avisa al mostrarse
}
function initCopia(){
  const dejar=()=>{const f=$('.view.on button.on')||$('#cfgBtn'); if(f) f.focus({preventScroll:true})};   // el botón pulsado desaparece: el foco pasa a un control de la pantalla
  $('#bkOk').onclick=()=>{LS.set('bk',todayStr()); LS.set('bksnz',null); renderCopia(); say('Copia anotada. Aviso oculto.'); dejar()};
  $('#bkLater').onclick=()=>{LS.set('bksnz',todayStr()); renderCopia(); say('Aviso oculto hasta mañana.'); dejar()};
}
const ahorroRowHtml=()=>{if(!ahorroOk()) return ''; const a=ahorroActual(ahorros(),todayStr()); return `<div class="bkrow"><span>${a?'Ahorro actual: '+esc(eur0(a.monto))+' ('+esc(fechaCorta(a.fecha))+')':'Ahorro: sin registrar'}</span><button class="chip" id="sAh" type="button">Actualizar ahorro</button></div>`};
const bkRowHtml=()=>{const hoy=ultimaCopia()===todayStr(); return `<div class="bkrow"><span id="bkLine">Última copia del Sheet: ${fechaLarga(ultimaCopia())}</span><button class="chip" id="sBk"${hoy?' disabled':''}>${hoy?'Hecha hoy':'Ya la hice hoy'}</button></div>`};

const DEFAULT_CATS=[
 ...['Renta','Supermercado','Salidas','Transporte','Teléfono/Internet','Suscripciones','Viajes y Ocio','Salud y Cuidado','Ropa','Hogar','Regalos','Comidas de trabajo','Otros'].map(n=>({nombre:n,tipo:'Gasto',ambito:'Personal'})),
 ...['Impuestos','Cuota autónomo','Gestoría','Software y herramientas','Otros'].map(n=>({nombre:n,tipo:'Gasto',ambito:'Sporture'})),
 {nombre:'Freelance',tipo:'Ingreso',ambito:'Personal'},{nombre:'Otros',tipo:'Ingreso',ambito:'Personal'},{nombre:'Sporture',tipo:'Ingreso',ambito:'Sporture'},{nombre:'LaLiga',tipo:'Ingreso',ambito:'LaLiga'}];

// Si el Sheet no trae categorías de gasto de LaLiga, se usan estas (ya existentes en otros ámbitos).
const LALIGA_GASTO=['Comidas de trabajo','Transporte','Viajes y Ocio','Otros'];

let cfg=LS.get('cfg',null);
let db=LS.get('db',{movimientos:[],categorias:[],personas:[],deuda:[]});
let queue=LS.get('queue',[]), delQ=LS.get('delq',[]);
let dq=LS.get('dq',[]), ddq=LS.get('ddq',[]);   // pagos de la deuda por enviar / por borrar (cola aparte de los movimientos)
let aq=LS.get('aq',[]), adq=LS.get('adq',[]);   // fotos del ahorro por enviar / por borrar (otra cola aparte)
if(!db||typeof db!=='object') db={movimientos:[],categorias:[],personas:[],deuda:[]};
if(!Array.isArray(db.ahorro)) db.ahorro=[];     // copias locales anteriores no traen la lista
const ahorros=()=>Array.isArray(db.ahorro)?db.ahorro:[];
const persist=()=>{LS.set('db',db);LS.set('queue',queue);LS.set('delq',delQ);LS.set('dq',dq);LS.set('ddq',ddq);LS.set('aq',aq);LS.set('adq',adq)};

/* ---------- red ---------- */
// Cualquier fallo se reduce a un código interno; el texto crudo del error nunca llega a la pantalla.
const syncErr=code=>Object.assign(new Error(code),{code});
const STOP_CODES=['clave','bloqueado','config','url'];   // no se reintentan solos
// La dirección del script solo puede ser https://script.google.com/…/exec (sin usuario, sin puerto, sin otro dominio).
// Es la única comprobación: la usan Ajustes, el enlace de configuración (#u=…&k=…) y cada envío.
function urlScriptOk(u){
  if(typeof u!=='string'||!/^[^\s\\]+$/.test(u)) return false;   // sin espacios, saltos ni barras invertidas
  let x; try{ x=new URL(u) }catch{ return false }
  return x.protocol==='https:'&&x.hostname==='script.google.com'&&!x.username&&!x.password&&!x.port&&!x.hash&&x.pathname.length>'/exec'.length&&x.pathname.endsWith('/exec');
}
async function api(body){
  if(!cfg||typeof cfg!=='object'||typeof cfg.key!=='string'||!cfg.key) throw syncErr('config');
  if(!urlScriptOk(cfg.url)) throw syncErr('url');   // nada se envía a una dirección que no sea la de Apps Script
  const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),25000); let txt;
  try{
    const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:cfg.key,...body}),signal:ctl.signal});
    txt=await r.text();
  }catch{ throw syncErr('red') } finally{ clearTimeout(t) }
  let j; try{ j=JSON.parse(txt) }catch{ throw syncErr('formato') }
  if(!j||typeof j!=='object') throw syncErr('formato');
  if(!j.ok) throw syncErr([...STOP_CODES,'datos'].includes(j.error)?j.error:'servidor');
  return j;
}
const RETRY=[2000,5000,15000,45000];   // espera antes de cada reintento automático (5 intentos en total)
let lastSay='', syncing=false, again=false, attempt=0, retryT=null, halt=null, lastSync=LS.get('lastsync',0), rejected=LS.get('rejected',[]), syncState={k:'idle'}, compact=false, compactT=null, caps=LS.get('caps',{});
const STOP_MSG={clave:'La clave no es correcta',bloqueado:'Demasiados intentos, espera unos 15 minutos',config:'Falta configurar el script',url:'La dirección del script guardada no es válida y no se envía nada. Corrígela en Ajustes'};
const STOP_SHORT={clave:'La clave no es correcta',bloqueado:'Espera unos 15 min',config:'Falta configurar el script',url:'Dirección del script no válida'};   // versión corta para el botón; la larga va en el aria-label
function setPill(k,code){syncState={k,code};renderPill()}
function ago(t){
  if(!t) return 'aún sin sincronizar';
  const m=Math.max(0,Math.floor((Date.now()-t)/60000));
  if(m<1) return 'hace un momento'; if(m<60) return `hace ${m} min`;
  const h=Math.floor(m/60); return h<24?`hace ${h} h`:`hace ${Math.floor(h/24)} d`;
}
const aBloq=()=>ahorroOk()?0:aq.length+adq.length;   // fotos de ahorro que esperan a que el script las admita
const dBloq=()=>dq.filter(x=>!(deudaOk()&&enviableD(x))).length+(deudaOk()?0:ddq.length);   // registros de deuda que esperan a que el script los admita
function renderPill(){
  const b=$('#sync'), n=queue.length+delQ.length+dq.length+ddq.length+aq.length+adq.length, k=syncState.k, off=!navigator.onLine||k==='off', nr=rejected.length;
  let label, cls='', note=`Última vez: ${ago(lastSync)}`, full='';
  if(!cfg){label='Sin configurar'; cls='wait'; note='Toca para conectar'}
  else {
    if(k==='sync'){label='Sincronizando…'; cls='wait'}
    else if(off){label=n?`Sin conexión · ${n} en cola`:'Sin conexión'; cls='off'}
    else if(n){label=`Pendiente (${n})`; cls='wait'}
    else if(k==='retry'||k==='fail'||k==='stop') label='Sin sincronizar';
    else label='Sincronizado';
    if(k==='retry'&&!off){note='Reintentando…'; full='No se pudo sincronizar, reintentando…'; cls='wait'}
    else if(k==='fail'&&!off){note='Toca para reintentar'; full='No se pudo sincronizar. Toca para reintentar.'; cls='err'}
    else if(k==='stop'){note=STOP_SHORT[syncState.code]||'No se pudo sincronizar'; full=STOP_MSG[syncState.code]||note; cls='err'}
    else if(nr&&k!=='sync'){const pl=nr>1?'s':''; note=rejected.every(r=>r.motivo==='reembolso')?`${nr} reembolso${pl} sin guardar`:rejected.every(r=>r.motivo==='deuda')?`${nr} registro${pl} de deuda no válido${pl}`:rejected.every(r=>r.motivo==='ahorro')?`${nr} registro${pl} de ahorro no válido${pl}`:`${nr} movimiento${pl} no válido${pl}`; full=note+'. Toca para revisar.'; cls='err'}
    else if(k==='ok'&&dBloq()>0){const pn=dBloq(); note=`${pn} registro${pn>1?'s':''} de deuda sin enviar`; full=note+': el script no los admite todavía. Actualízalo.'; cls='err'}
    else if(k==='ok'&&aBloq()>0){const pn=aBloq(); note=`${pn} registro${pn>1?'s':''} de ahorro sin enviar`; full=note+': el script no los admite todavía. Actualízalo.'; cls='err'}
  }
  // Compacto (solo icono y puntito) 3 s después de quedar todo sincronizado; se expande en cuanto hay algo que decir.
  const calm=!!cfg&&k==='ok'&&!n&&!nr&&!off;
  if(calm){ if(!compact&&!compactT) compactT=setTimeout(()=>{compactT=null;compact=true;renderPill()},3000) }
  else { clearTimeout(compactT); compactT=null; compact=false }
  b.className='syncbtn '+cls+(k==='sync'?' spin':'')+(compact?' compact':'');
  $('#syncL').textContent=label; $('#syncN').textContent=note;
  b.setAttribute('aria-label',`Sincronizar ahora. ${label}. ${full||note}`);
  const key=label+'|'+full;
  const estable=(k==='ok'&&!n&&!off)||off||k==='retry'||k==='fail'||k==='stop';   // no se anuncian los estados de paso (p. ej. el "Pendiente" justo antes de sincronizar)
  if(cfg&&k!=='idle'&&estable&&key!==lastSay){lastSay=key; say(label+(full?'. '+full:''))}
}
const reembOk=()=>!!caps&&caps.reembolso===true;   // el script avisa de que entiende el campo "reembolso"
const deudaOk=()=>!!caps&&caps.deuda===true;       // el script avisa de que sabe escribir pagos de la deuda
const ahorroOk=()=>!!caps&&caps.ahorro===true;     // el script avisa de que sabe guardar el ahorro
const recibidoOk=()=>deudaOk()&&caps.recibidos===true;   // ...y también ayudas recibidas
const enviableD=x=>/^pagado$/i.test(String(x.tipo||'').trim())||recibidoOk();   // un pago sale con deudaEscritura; una ayuda, solo si el script la admite
function showRejected(){
  const solo=rejected.length>0&&rejected.every(m=>m.motivo==='reembolso'), pagos=rejected.length>0&&rejected.every(m=>m.motivo==='deuda'), ahor=rejected.length>0&&rejected.every(m=>m.motivo==='ahorro');

// Disparador nuevo (abrir, guardar, volver la conexión, volver a la app, tocar el botón): empieza la cuenta de reintentos de cero.
function sync(force){ clearTimeout(retryT); retryT=null; attempt=0; return run(force) }
async function run(force){
  if(!cfg) return;

  if(halt&&!force){ if(halt.code==='bloqueado'&&Date.now()>halt.until) halt=null; else return }   // no insistir con una clave mala
  if(!navigator.onLine&&!force){setPill('off');return}

  let ok=false, code='red', apartados=0, apartadosD=0, apartadosA=0, malTag=0, dSaltado=false, aSaltado=false; const tagged=[];
  // Un envío aceptado: si se deshizo mientras viajaba, ya está en el Sheet y se manda a borrar.
  const enviado=items=>{
    for(const b of items) if(!queue.some(x=>x.id===b.id)) delQ.push(b.id);
    for(const b of items) if(b.reembolso) tagged.push(b);
    queue=queue.filter(x=>!items.some(b=>b.id===x.id)); persist();
  };
  // Pagos de la deuda: igual que arriba (si se deshizo mientras viajaba, ya está en el Sheet y se manda a borrar).
  const enviadoD=items=>{
    for(const b of items) if(!dq.some(x=>x.id===b.id)) ddq.push(b.id);
    dq=dq.filter(x=>!items.some(b=>b.id===x.id)); persist();
  };
  // Fotos del ahorro: igual que arriba (si se borró mientras viajaba, ya está en el Sheet y se manda a borrar).
  const enviadoA=items=>{
    for(const b of items) if(!aq.some(x=>x.id===b.id)) adq.push(b.id);
    aq=aq.filter(x=>!items.some(b=>b.id===x.id)); persist();
  };
  try{
    while(delQ.length){ const id=delQ[0]; await api({action:'delete',id}); delQ=delQ.filter(x=>x!==id); persist() }   // ok aunque la fila ya no exista
    if(queue.length){
      const batch=queue.slice();
      try{ await api({action:'add',items:batch}); enviado(batch) }
      catch(e){
        if(e.code!=='datos') throw e;
        // Hay un movimiento inválido en el lote: se prueban de uno en uno (el mismo id no se duplica) y solo se aparta el malo.
        for(const it of batch){
          try{ await api({action:'add',items:[it]}); enviado([it]) }
          catch(e2){
            if(e2.code!=='datos') throw e2;
            if(queue.some(x=>x.id===it.id)){ queue=queue.filter(x=>x.id!==it.id); rejected.push(it); LS.set('rejected',rejected); persist(); apartados++ }
          }
        }
      }
    }
    if(deudaOk()){
      while(ddq.length){ const id=ddq[0]; await api({action:'debtDelete',id}); ddq=ddq.filter(x=>x!==id); persist() }   // ok aunque la fila ya no exista
      for(;;){
        const batch=dq.filter(enviableD).slice(0,200); if(!batch.length) break;   // las ayudas esperan si el script aún no las admite
        try{ await api({action:'debtAdd',items:batch}); enviadoD(batch) }
        catch(e){
          if(e.code!=='datos') throw e;
          for(const it of batch){   // un pago inválido en el lote: de uno en uno (el mismo id no se duplica) y solo se aparta el malo
            try{ await api({action:'debtAdd',items:[it]}); enviadoD([it]) }
            catch(e2){
              if(e2.code!=='datos') throw e2;
              if(dq.some(x=>x.id===it.id)){ dq=dq.filter(x=>x.id!==it.id); rejected.push({...it,motivo:'deuda'}); LS.set('rejected',rejected); persist(); apartadosD++ }
            }
          }
        }
      }
    }
    if(ahorroOk()){
      while(adq.length){ const id=adq[0]; await api({action:'savingsDelete',id}); adq=adq.filter(x=>x!==id); persist() }   // ok aunque la fila ya no exista
      for(;;){
        const batch=aq.slice(0,200); if(!batch.length) break;
        try{ await api({action:'savingsAdd',items:batch}); enviadoA(batch) }
        catch(e){
          if(e.code!=='datos') throw e;
          for(const it of batch){   // una foto inválida en el lote: de una en una (el mismo id no se duplica) y solo se aparta la mala
            try{ await api({action:'savingsAdd',items:[it]}); enviadoA([it]) }
            catch(e2){
              if(e2.code!=='datos') throw e2;
              if(aq.some(x=>x.id===it.id)){ aq=aq.filter(x=>x.id!==it.id); rejected.push({...it,motivo:'ahorro'}); LS.set('rejected',rejected); persist(); apartadosA++ }
            }
          }
        }
      }
    }
    dSaltado=dBloq()>0; aSaltado=aBloq()>0;   // script antiguo (o aún sin saber): no se envía nada de eso, la cola espera
    const d=await api({action:'data'}), dels=new Set(delQ.map(String)), ddels=new Set(ddq.map(String)), adels=new Set(adq.map(String));
    db={movimientos:(d.movimientos||[]).filter(m=>!dels.has(String(m.id))),categorias:d.categorias||[],personas:d.personas||[],deuda:(d.deuda||[]).filter(x=>!ddels.has(String(x.id))),ahorro:(Array.isArray(d.ahorro)?d.ahorro:[]).filter(x=>!adels.has(String(x.id)))};
    for(const q of queue) if(!db.movimientos.some(m=>m.id===q.id)) db.movimientos.push(q);
    for(const q of dq) if(!db.deuda.some(x=>String(x.id)===q.id)) db.deuda.push(q);
    for(const q of aq) if(!db.ahorro.some(x=>String(x.id)===q.id)) db.ahorro.push(q);
    caps={reembolso:d.reembolso===true,deuda:d.deudaEscritura===true,recibidos:d.deudaRecibidos===true,ahorro:d.ahorroEscritura===true}; LS.set('caps',caps);   // sin el flag la fila de reembolso, los pagos y el ahorro se ocultan y no se envía nada
    if(dSaltado&&dq.some(x=>deudaOk()&&enviableD(x))) again=true;   // el script ya los admite: se envían en la pasada siguiente
    if(aSaltado&&ahorroOk()) again=true;
    // Comprobación acotada (no lanza ni frena nada): si un movimiento enviado con marca vuelve sin ella, el script no la guardó.
    if(tagged.length){ try{
      const por=new Map((d.movimientos||[]).map(m=>[String(m.id),m]));
      for(const it of tagged){ const sv=por.get(String(it.id)); if(sv&&(sv.reembolso||'')!==it.reembolso&&!rejected.some(r=>r.id===it.id)){rejected.push({...it,motivo:'reembolso'}); malTag++} }
      if(malTag) LS.set('rejected',rejected);
    }catch{} }
    idx=null; persist(); ok=true;
  }catch(e){ code=(e&&e.code)||'red' }
  finally{ syncing=false }
  if(ok){ attempt=0; halt=null; lastSync=Date.now(); LS.set('lastsync',lastSync); setPill('ok'); renderAll();
    if(malTag) toast(`El script no guardó el reembolso de ${malTag>1?malTag+' movimientos':'un movimiento'}. Toca el indicador para verlo.`);
    if(apartados) toast(`${apartados>1?apartados+' movimientos no se han':'Un movimiento no se ha'} podido guardar y se ha apartado. Toca el indicador para verlo.`);
    if(apartadosA) toast(`${apartadosA>1?apartadosA+' registros de ahorro no se han':'Un registro de ahorro no se ha'} podido guardar y se ha apartado. Toca el indicador para verlo.`);
    if(apartadosD) toast(`${apartadosD>1?apartadosD+' registros de deuda no se han':'Un registro de deuda no se ha'} podido guardar y se ha apartado. Toca el indicador para verlo.`) }
  else if(STOP_CODES.includes(code)){ halt={code,until:Date.now()+15*60000}; setPill('stop',code) }
  else if(!navigator.onLine) setPill('off');
  else if(attempt<RETRY.length){ setPill('retry'); retryT=setTimeout(()=>{retryT=null;attempt++;run()},RETRY[attempt]) }
  else setPill('fail');
  if(again){again=false; if(queue.length||delQ.length||dq.length||ddq.length||aq.length||adq.length) sync()}   // se guardó algo mientras sincronizaba
}

/* ---------- datos derivados ---------- */
const cats=()=>db.categorias&&db.categorias.length?db.categorias:DEFAULT_CATS;
const STOP=new Set(['con','una','uno','los','las','del','por','para','que','mas','sin','el','la','de','en','y','al']);
const tok=s=>norm(s).split(/[^a-z0-9]+/).filter(w=>w.length>=3&&!STOP.has(w));
let idx=null;
function buildIdx(){idx={};for(const m of db.movimientos){const k=m.tipo+'|'+m.ambito;const o=idx[k]||(idx[k]={});for(const w of new Set(tok(m.descripcion))){const c=o[w]||(o[w]={});c[m.categoria]=(c[m.categoria]||0)+1}}}
function suggest(text){
  if(!idx) buildIdx(); const o=idx[st.tipo+'|'+st.ambito]; if(!o) return null; const sc={};
  for(const w of new Set(tok(text))){const c=o[w]; if(!c) continue; const tot=Object.values(c).reduce((a,b)=>a+b,0);
    for(const [cat,n] of Object.entries(c)) sc[cat]=(sc[cat]||0)+(n/tot)*Math.min(1,Math.log2(tot+1)/2)}
  let best=null,bs=0; for(const [c,s] of Object.entries(sc)) if(s>bs){best=c;bs=s}
  return bs>=0.5?best:null;
}
function recentCounts(field,tipo,ambito,days=120){
  const lim=new Date(Date.now()-days*864e5).toISOString().slice(0,10), c={};
  for(const m of db.movimientos){ if(m.fecha<lim) continue; if(tipo&&m.tipo!==tipo) continue; if(ambito&&m.ambito!==ambito) continue;
    const vals=field==='personas'?String(m.personas||'').split(',').map(s=>s.trim()).filter(Boolean):[m.categoria];
    for(const v of vals) c[v]=(c[v]||0)+1 }
  return c;
}
function personaMatchers(){
  return db.personas.map(p=>{const names=[p.nombre,...String(p.alias||'').split(',').map(s=>s.trim()).filter(Boolean)].map(norm).filter(Boolean);
    return {nombre:p.nombre,re:new RegExp('(^|[^a-z0-9])('+names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')($|[^a-z0-9])')}});
}

/* Cálculos del Resumen (sin pantalla, para poder comprobarlos aparte).
   o = {scope, ym, period:'mes'|'12', hoy:'AAAA-MM-DD' (fecha local)} */
function cmpIgualDia(gm,ym,hoy){
  const prev=ymAdd(ym,-1), parcial=ym===hoy.slice(0,7), d=parcial?+hoy.slice(8,10):31;
  const [py,pm]=prev.split('-').map(Number), dp=new Date(py,pm,0).getDate();   // días del mes anterior (con bisiestos)
  const dPrev=parcial?Math.min(d,dp):dp;
  const hasta=(mm,top)=>sumBy(gm.filter(m=>m.fecha.startsWith(mm)&&+m.fecha.slice(8,10)<=top),m=>m.monto);
  const actual=hasta(ym,d), anterior=hasta(prev,dPrev);
  return {prev,parcial,d,dPrev,actual,anterior,diff:r2(actual-anterior)};
}
function resumenCalc(movs,o){
  const enAmb=m=>o.scope==='Todo'||m.ambito===o.scope;
  const gm=movs.filter(m=>m.tipo==='Gasto'&&enAmb(m));
  const desde=ymAdd(o.ym,-11)+'-01', hasta=ymAdd(o.ym,1)+'-01';
  const enPer=m=>o.period==='mes'?m.fecha.startsWith(o.ym):(m.fecha>=desde&&m.fecha<hasta);
  const periodMovs=gm.filter(enPer);
  const gasto=sumBy(periodMovs,m=>m.monto);
  const ingresos=sumBy(movs.filter(m=>m.tipo==='Ingreso'&&enAmb(m)&&enPer(m)),m=>m.monto);
  const pend=(o.scope==='LaLiga'||o.scope==='Todo')?movs.filter(m=>m.tipo==='Gasto'&&m.ambito==='LaLiga'&&m.reembolso==='A reembolsar'):[];
  return {gm,periodMovs,gasto,ingresos,balance:r2(ingresos-gasto),pend,pendT:sumBy(pend,m=>m.monto),
    cmp:o.period==='mes'?cmpIgualDia(gm,o.ym,o.hoy):null};
}

const esPagado=d=>String(d.tipo||'').trim().toLowerCase()==='pagado';   // el script escribe «Pagado»; se compara sin mirar mayúsculas
function deudaCalc(rows){
  const num=d=>Number(d.monto_eur)||0, pag=rows.filter(esPagado), rec=rows.filter(d=>!esPagado(d));   // todo lo que no es «Pagado» suma como recibido (como hasta ahora)
  const recibido=sumBy(rec,num), pagado=sumBy(pag,num);
  const ultima=rec.filter(d=>String(d.tipo||'').trim().toLowerCase()==='recibido').sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)))[0];

  const todos=rows.slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));   // pagos y ayudas, lo más reciente primero
  return {recibido,pagado,saldo:r2(recibido-pagado),ultima,pagos,todos};
}

// Categorías que cuentan como gasto fijo (se comparan sin mayúsculas ni acentos). Se editan aquí.
const FIJAS=['Renta','Teléfono/Internet','Suscripciones','Cuota autónomo','Gestoría'].map(norm);
const esFija=c=>FIJAS.includes(norm(c));
const reembolsable=m=>m.ambito==='LaLiga'&&(m.reembolso==='A reembolsar'||m.reembolso==='Reembolsado');   // el dinero vuelve: no es gasto del margen
const MIN_GASTOS=5, MIN_DIAS=3, VENTANA=6, MIN_TIPICO=3, MIN_BALANCE=2, AHORRO_VIEJO=60;
const mediana=a=>{const s=a.slice().sort((x,y)=>x-y), n=s.length; return r2(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2)};
const diasEntre=(a,b)=>Math.round((Date.UTC(+b.slice(0,4),+b.slice(5,7)-1,+b.slice(8,10))-Date.UTC(+a.slice(0,4),+a.slice(5,7)-1,+a.slice(8,10)))/864e5);
function ahorroActual(rows,hoy){   // la foto más reciente que no sea futura; a igual fecha, la última añadida
  let best=null;
  for(const a of rows||[]){
    const f=String(a.fecha||'').slice(0,10); if(!fechaOk(f)||f>hoy||a.monto_eur===''||a.monto_eur==null) continue;
    const mo=Number(a.monto_eur); if(!isFinite(mo)||mo<0) continue;
    if(!best||f>=best.fecha) best={id:String(a.id||''),fecha:f,monto:mo,nota:a.nota||''};
  }
  return best;
}
function margenCalc(movs,ahorroRows,hoy){
  const cur=hoy.slice(0,7), por={};
  for(const m of movs||[]){
    const ym=String(m.fecha||'').slice(0,7); if(!/^\d{4}-\d{2}$/.test(ym)||ym>=cur) continue;   // solo meses completos ya pasados
    const mo=Number(m.monto); if(!isFinite(mo)) continue;
    const s=por[ym]||(por[ym]={gasto:0,fijo:0,ingreso:0,n:0,dias:new Set(),amb:{}}), a=s.amb[m.ambito]||(s.amb[m.ambito]={gasto:0,ingreso:0});
    if(m.tipo==='Ingreso'){ s.ingreso+=mo; a.ingreso+=mo }
    else if(m.tipo==='Gasto'&&!reembolsable(m)){ s.gasto+=mo; a.gasto+=mo; if(esFija(m.categoria)) s.fijo+=mo; s.n++; s.dias.add(String(m.fecha).slice(0,10)) }
  }
  const vacio={gasto:0,fijo:0,ingreso:0,n:0,dias:new Set(),amb:{}}, get=ym=>por[ym]||vacio, valido=s=>s.n>=MIN_GASTOS&&s.dias.size>=MIN_DIAS;
  const ventana=[]; for(let k=1;k<=36&&ventana.length<VENTANA;k++){ const ym=ymAdd(cur,-k), s=get(ym); if(valido(s)) ventana.push(s) }
  const nV=ventana.length, tipico=nV>=MIN_TIPICO?mediana(ventana.map(s=>s.gasto)):null;
  const fijo=tipico==null?null:mediana(ventana.map(s=>s.fijo)), variable=tipico==null?null:r2(tipico-fijo);
  const conIng=ventana.filter(s=>s.ingreso>0).length;
  const ingresoMedio=tipico!=null&&conIng>=2?r2(ventana.reduce((a,s)=>a+s.ingreso,0)/nV):null;
  const margen=ingresoMedio==null?null:r2(ingresoMedio-tipico);
  const porAmbito=tipico==null?null:['Personal','Sporture','LaLiga'].map(n=>({ambito:n,
    gasto:r2(ventana.reduce((a,s)=>a+((s.amb[n]||{}).gasto||0),0)/nV), ingreso:r2(ventana.reduce((a,s)=>a+((s.amb[n]||{}).ingreso||0),0)/nV)}));
  const win=(a,b)=>{const o=[]; for(let k=a;k<=b;k++){const ym=ymAdd(cur,-k), s=get(ym); o.push({ym,valido:valido(s),balance:r2(s.ingreso-s.gasto)})} return o};
  const rec=win(1,3), vr=rec.filter(x=>x.valido), va=win(4,6).filter(x=>x.valido);
  const balance3=vr.length>=MIN_BALANCE?{total:r2(vr.reduce((a,x)=>a+x.balance,0)),n:vr.length,meses:rec}:null;
  let tendencia=null;
  if(vr.length>=MIN_BALANCE&&va.length>=MIN_BALANCE){
    const dif=vr.reduce((a,x)=>a+x.balance,0)/vr.length-va.reduce((a,x)=>a+x.balance,0)/va.length, u=Math.max(50,0.1*(tipico||0));
    tendencia=dif>u?'mejorando':dif<-u?'empeorando':'igual';
  }
  const A=ahorroActual(ahorroRows,hoy), colchon=A&&tipico>0?Math.round(A.monto/tipico*10)/10:null;
  const pend=(movs||[]).filter(m=>m.tipo==='Gasto'&&m.ambito==='LaLiga'&&m.reembolso==='A reembolsar');
  return {nV,tipico,fijo,variable,ingresoMedio,ingMin:nV?r2(Math.min(...ventana.map(s=>s.ingreso))):null,ingMax:nV?r2(Math.max(...ventana.map(s=>s.ingreso))):null,
    margen,porAmbito,rec,balance3,tendencia,ahorro:A,colchon,diasAhorro:A?diasEntre(A.fecha,hoy):null,porCobrar:{n:pend.length,total:sumBy(pend,m=>m.monto)}};
}
// Simulador «¿Y si…?»: solo cuentas, no guarda nada. Los campos vacíos llegan como null.
function simCalc({ahorro,tipico,ingreso,padres,extra,meses}){
  const pad=padres||0, o={queda:null,colchon:null,aporte:null,quedaTrasAporte:null,tarda:null,cubre:false,colchonTras:null};
  if(ingreso!=null) o.queda=r2(ingreso-tipico-pad);
  if(ahorro!=null&&tipico+pad>0) o.colchon=Math.round(ahorro/(tipico+pad)*10)/10;
  if(extra>0){
    if(meses>0){ o.aporte=r2(extra/meses); if(o.queda!=null) o.quedaTrasAporte=r2(o.queda-o.aporte) }
    if(o.queda!=null&&o.queda>0) o.tarda=Math.ceil(extra/o.queda-1e-9);
    if(ahorro!=null&&ahorro>=extra){ o.cubre=true; if(tipico+pad>0) o.colchonTras=Math.round((ahorro-extra)/(tipico+pad)*10)/10 }
  }
  return o;
}

function parseMonto(txt,cero=false){   // «12,5», «12.50» o «1.200,50»; devuelve un número o un texto con el motivo
  let t=String(txt).trim().replace(/\s/g,'').replace(/€/g,''); if(!t) return 'Escribe el monto.';
  if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');
  if(!/^\d+(\.\d+)?$/.test(t)) return 'Escribe solo números, por ejemplo 150 o 150,50.';
  if(/\.\d{3,}$/.test(t)) return 'Usa como máximo 2 decimales.';
  const n=Math.round(parseFloat(t)*100)/100;
  if(cero?!(n>=0):!(n>0)) return 'El monto tiene que ser mayor que 0.';
  if(n>1e7) return 'Ese monto es demasiado grande.';
  return n;
}

  if($('#btnAhorro')) $('#btnAhorro').onclick=abrirAhorro;
  if($('#btnPago')) $('#btnPago').onclick=()=>abrirPago('Pagado');
  if($('#btnAyuda')) $('#btnAyuda').onclick=()=>abrirPago('Recibido');
  v.querySelectorAll('.delp').forEach(b=>b.onclick=()=>borrarPago(b.dataset.id));
  if($('#verPagos')) $('#verPagos').onclick=e=>{const b=e.currentTarget, abre=b.getAttribute('aria-expanded')!=='true'; v.querySelectorAll('.pago.extra').forEach(li=>li.hidden=!abre); b.setAttribute('aria-expanded',abre); b.textContent=abre?'Ver menos':`Ver todos (${D.todos.length})`};
  v.querySelectorAll('svg g[data-ym]').forEach(g=>{g.onclick=()=>{sum.ym=g.dataset.ym;renderSum()}; g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();g.onclick()}}});
  v.querySelectorAll('button.row').forEach(b=>b.onclick=()=>{
    const box=v.querySelector(`.detail[data-for="${CSS.escape(b.dataset.cat)}"]`);
    if(!box.hidden){box.hidden=true;b.setAttribute('aria-expanded','false');return}
    const items=periodMovs.filter(m=>m.categoria===b.dataset.cat).sort((a,c)=>c.monto-a.monto).slice(0,6);
    box.innerHTML=items.map(m=>`<div><span>${esc(m.descripcion)}${m.personas?' · '+esc(m.personas):''}</span><span>${eur(m.monto)}</span></div>`).join('');
    box.hidden=false; b.setAttribute('aria-expanded','true')});
}

/* ---------- historial ---------- */
function renderHis(){
  const v=$('#v-his'), list=db.movimientos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)||0).slice(0,80);
  let html=`<div class="head" style="margin-top:6px"><span class="sub" style="margin:0;color:var(--muted);font-size:.875rem">${list.length?`Últimos ${list.length} movimientos`:'Sin movimientos'}</span><button class="chip" id="cfgBtn">Ajustes</button></div>`;
  let last='';
  if(!list.length) html+=`<div class="card">${!cfg||sinCargar()?emptyConn():emptyBlock('list','Aún no hay movimientos','Cuando registres un gasto o un ingreso, aparecerá aquí.',{act:'reg',label:'Registrar un gasto'})}</div>`;
  for(const m of list){
    if(m.fecha!==last){last=m.fecha; const [y,mo,d]=m.fecha.split('-'); html+=`<div class="day">${m.fecha===todayStr()?'Hoy':esc(`${+d} de ${MES[mo-1]} ${y}`)}</div>`}
    html+=`<button class="mov" data-id="${esc(m.id)}"><span class="d">${esc(m.descripcion)}</span><span class="s">${esc(m.categoria)}${m.personas?' · '+esc(m.personas):''}${m.ambito!=='Personal'&&m.ambito!==m.categoria?' · '+esc(m.ambito):''}</span><span class="a ${m.tipo==='Ingreso'?'in':''}">${m.tipo==='Ingreso'?'+':''}${eur(m.monto)}</span>${m.reembolso?`<span class="t"><span class="tag tag-${({'Personal':'p','A reembolsar':'a','Reembolsado':'r'})[m.reembolso]||'p'}">${esc(m.reembolso)}</span></span>`:''}</button>`;
  }
  v.innerHTML=html;
  $('#cfgBtn').onclick=openSettings;
  v.querySelectorAll('.mov').forEach(b=>b.onclick=()=>{
    const m=db.movimientos.find(x=>x.id===b.dataset.id); if(!m) return;
    openSheet(`<h2>${esc(m.descripcion)}</h2><p>${eur(m.monto)} · ${esc(m.categoria)} · ${esc(m.ambito)}${m.personas?' · con '+esc(m.personas):''}<br>${esc(m.fecha)}${m.fecha_aprox==='Sí'?' (fecha aproximada)':''}${m.reembolso?'<br>Reembolso: '+esc(m.reembolso):''}</p><div class="btns"><button class="secondary" id="sNo">Cerrar</button><button class="secondary" id="sEdit">Editar</button><button class="primary danger" id="sDel">Eliminar</button></div>${m.reembolso==='A reembolsar'&&reembOk()?'<div class="btns"><button class="primary" id="sRe">Marcar como reembolsado</button></div>':''}`);
    $('#sNo').onclick=closeSheet; if($('#sRe')) $('#sRe').onclick=()=>{closeSheet(); marcarReembolsado(m)};
    $('#sEdit').onclick=()=>{closeSheet(); Object.assign(st,{tipo:m.tipo,ambito:m.ambito,amount:String(m.monto).replace('.',','),desc:m.descripcion,cat:m.categoria,catAuto:false,people:new Set(String(m.personas||'').split(',').map(x=>x.trim()).filter(Boolean)),dismissed:new Set(),fecha:m.fecha,extraPeople:[],editId:m.id,reemb:m.reembolso||'',reembOrig:m.reembolso||''}); $('#desc').value=m.descripcion; tab('add'); renderAdd()}; $('#sDel').onclick=()=>{closeSheet();removeMov(m.id);toast('Movimiento eliminado')};
  });
}

/* ---------- ajustes / conexión ---------- */
function openSettings(first){
  openSheet(`<h2>${first===true?'Conecta tu hoja':'Ajustes'}</h2><p>${first===true?'Pega la dirección del script y la clave. Se guardan solo en este móvil.':'Pega la URL de la implementación de Apps Script y la clave que elegiste. Se guardan solo en este móvil.'}</p>
  <label for="cu">URL de la implementación</label><input id="cu" inputmode="url" autocapitalize="off" autocorrect="off" value="${esc(cfg?.url||'')}" placeholder="https://script.google.com/macros/s/…/exec">
  <label for="ck">Clave</label><input id="ck" type="password" autocapitalize="off" autocorrect="off" value="${esc(cfg?.key||'')}" placeholder="La misma que en el código">
  <div id="cerr" class="err" hidden></div>
  <div class="btns"><button class="secondary" id="sNo">${first===true?'Más tarde':'Cerrar'}</button><button class="primary" id="sOk">Conectar</button></div>
  ${first===true?'':ahorroRowHtml()}
  ${first===true?'':bkRowHtml()}
  ${first===true?'':'<div class="btns"><button class="secondary" id="sReset" style="width:100%;min-height:46px">Borrar datos de este móvil</button></div>'}`);
  if($('#sNo')) $('#sNo').onclick=closeSheet;
  if($('#sAh')) $('#sAh').onclick=abrirAhorro;
  if($('#sBk')) $('#sBk').onclick=()=>{LS.set('bk',todayStr()); LS.set('bksnz',null); $('#bkLine').textContent='Última copia del Sheet: '+fechaLarga(todayStr()); $('#sBk').disabled=true; $('#sBk').textContent='Hecha hoy'; renderCopia(); say('Copia anotada: hoy')};
  if($('#sReset')) $('#sReset').onclick=()=>{if(confirm('Se borra la copia local y los movimientos sin sincronizar. ¿Seguir?')){localStorage.clear();location.reload()}};
  $('#sOk').onclick=async()=>{
    const url=$('#cu').value.trim(), key=$('#ck').value.trim(), er=$('#cerr'); er.hidden=true;
    if(!urlScriptOk(url)){er.textContent='La URL debe empezar por https://script.google.com y terminar en /exec.';er.hidden=false;return}
    if(!key){er.textContent='Escribe la clave.';er.hidden=false;return}
    $('#sOk').disabled=true; $('#sOk').textContent='Conectando…';
    const old=cfg; cfg={url,key};
    try{await api({action:'ping'});
      LS.set('cfg',cfg); halt=null; closeSheet(); await sync(); renderAll(); toast('Conectado')}
    catch(e){cfg=old; $('#sOk').disabled=false; $('#sOk').textContent='Conectar';
      er.textContent=e.code==='clave'?'La clave no coincide con la del código de Apps Script.':e.code==='bloqueado'?'Demasiados intentos, espera unos 15 minutos.':e.code==='url'?'La URL debe empezar por https://script.google.com y terminar en /exec.':e.code==='config'?'Falta configurar el script.':'No se pudo conectar. Revisa la URL y que el acceso de la implementación sea «Cualquier usuario».'; er.hidden=false}
  };
}
let sheetFrom=null;
function openSheet(html){
  sheetFrom=document.activeElement;
  $('#sheet').innerHTML=html; $('#scrim').classList.add('on');
  const h=$('#sheet h2'); if(h){h.id='sheetT'; $('#sheet').setAttribute('aria-labelledby','sheetT')}
  $('#app').inert=true; $('#app').setAttribute('aria-hidden','true');   // el fondo no se lee ni se toca mientras hay una ventana
  if(!$('#sIn')) setTimeout(()=>$('#sheet').focus(),30);
}
function closeSheet(){
  $('#scrim').classList.remove('on'); $('#app').inert=false; $('#app').removeAttribute('aria-hidden');
  const f=sheetFrom; sheetFrom=null;
  if(f&&f!==document.body&&document.contains(f)&&f.focus) setTimeout(()=>f.focus({preventScroll:true}),0);
}
const dismissSheet=()=>{const no=$('#sNo'); if(no) no.click(); else closeSheet()};
$('#scrim').onclick=e=>{if(e.target.id==='scrim') dismissSheet()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#scrim').classList.contains('on')) dismissSheet()});

/* ---------- navegación ---------- */
const TITLES={add:'Registrar',sum:'Resumen',his:'Historial'};
function tab(t){
  if(t!=='add'&&st.editId&&!(t==='his'&&!$('#v-add').classList.contains('on'))) resetForm();
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));
  $('#dock').hidden=t!=='add'; (t==='add'?$('#dock'):$('#navwrap')).appendChild($('#toast'));   // el aviso queda siempre encima de Guardar (o de la barra)
  applyTheme(); renderCopia();
  $$('.tabs button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.tab===t)); $$('.tabs button').forEach(b=>{if(b.dataset.tab===t) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current')});
  $('#title').textContent=TITLES[t]; $('#main').scrollTop=0; LS.set('tab',t);
  if(t==='sum') renderSum(); if(t==='his') renderHis();
}
function renderAll(){ renderAdd(); const t=LS.get('tab','add'); if(t==='sum') renderSum(); if(t==='his') renderHis(); renderPill(); renderCopia() }
$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$('#sync').onclick=()=>{if(!cfg) openSettings(true); else if(rejected.length) showRejected(); else if(!syncing) sync(true)};
window.addEventListener('online',()=>sync()); window.addEventListener('offline',()=>{setPill('off')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ sync(); renderPill(); renderCopia() }});
setInterval(()=>{renderPill(); renderCopia()},30000);

if(window.visualViewport){
  const vv=visualViewport, fit=()=>{const kb=innerHeight-vv.height, on=kb>120&&vv.scale<1.05; $('#app').style.height=on?vv.height+'px':''; if(on){window.scrollTo(0,0); setTimeout(fitTyping,0)}};
  vv.addEventListener('resize',fit); vv.addEventListener('scroll',fit);
}

/* ---------- arranque ---------- */
(function boot(){
  const h=new URLSearchParams(location.hash.slice(1)); let enlaceMalo=false;
  if(h.has('u')||h.has('k')){   // enlace de configuración: solo se acepta si la dirección es válida y hay clave; si no, se ignora entero y no se toca lo guardado
    const u=(h.get('u')||'').trim(), k=(h.get('k')||'').trim();
    if(urlScriptOk(u)&&k){cfg={url:u,key:k};LS.set('cfg',cfg)} else enlaceMalo=true;
    history.replaceState(null,'',location.pathname);   // en cualquier caso la clave no queda en la dirección ni en el historial
  }
  fitText(); window.addEventListener('resize',fitText); document.addEventListener('visibilitychange',()=>{if(!document.hidden) fitText()});
  initAdd(); initCopia(); renderAdd(); tab('add'); renderPill();
  if(enlaceMalo) toast('El enlace de configuración no es válido y se ha ignorado.');
  if(cfg){ sync() } else { openSettings(true) }
  if('serviceWorker' in navigator){
    // Si ya había una versión controlando la app y llega otra nueva, avisa (sin recargar solo, por si estás escribiendo).
    const hadSW=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadSW) $('#upd').hidden=false });
    $('#upd').onclick=()=>location.reload();
    navigator.serviceWorker.register('sw.js').then(reg=>{
      document.addEventListener('visibilitychange',()=>{if(!document.hidden) reg.update().catch(()=>{})});
    }).catch(()=>{});
  }
})();
</script>
